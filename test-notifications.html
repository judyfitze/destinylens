<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Notifications</title>
    <script src="js/notifications.js"></script>
</head>
<body style="background: #0a0a12; color: #fff; font-family: sans-serif; padding: 40px;">
    <h1>Notification Test</h1>
    <button onclick="testSuccess()" style="padding: 12px 24px; margin: 10px; background: #22c55e; border: none; border-radius: 8px; color: white; cursor: pointer;">Test Success</button>
    <button onclick="testError()" style="padding: 12px 24px; margin: 10px; background: #ef4444; border: none; border-radius: 8px; color: white; cursor: pointer;">Test Error</button>
    <button onclick="testWarning()" style="padding: 12px 24px; margin: 10px; background: #F6C26B; border: none; border-radius: 8px; color: black; cursor: pointer;">Test Warning</button>
    <button onclick="testAlert()" style="padding: 12px 24px; margin: 10px; background: #A94CF0; border: none; border-radius: 8px; color: white; cursor: pointer;">Test Alert Override</button>
    
    <div id="status" style="margin-top: 30px; padding: 20px; background: rgba(255,255,255,0.1); border-radius: 8px;"></div>
    
    <script>
        function updateStatus(msg) {
            document.getElementById('status').innerHTML += '<p>' + msg + '</p>';
        }
        
        function testSuccess() {
            window.showDLSuccess('This is a success message!');
            updateStatus('✓ showDLSuccess called');
        }
        
        function testError() {
            window.showDLError('This is an error message!');
            updateStatus('✓ showDLError called');
        }
        
        function testWarning() {
            window.showDLWarning('This is a warning message!');
            updateStatus('✓ showDLWarning called');
        }
        
        function testAlert() {
            alert('This should show as a branded toast, not a native alert!');
            updateStatus('✓ alert() called - should be branded');
        }
        
        // Check if override worked
        updateStatus('window.alert overridden: ' + (window.alert.toString().includes('showDLNotification') ? 'YES' : 'NO'));
        updateStatus('showDLWarning available: ' + (typeof window.showDLWarning !== 'undefined' ? 'YES' : 'NO'));
    </script>
</body>
</html>

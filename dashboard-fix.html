// REPLACE the deleteGoal function:
async function deleteGoal(index) {
    closeAllDropdowns();
    
    // Use native confirm if showDLConfirm not available
    let confirmed;
    if (window.showDLConfirm) {
        confirmed = await showDLConfirm({
            title: 'Delete Goal?',
            message: 'Are you sure you want to delete this goal? This action cannot be undone.',
            confirmText: 'Delete',
            cancelText: 'Cancel',
            type: 'warning'
        });
    } else {
        confirmed = confirm('Are you sure you want to delete this goal? This action cannot be undone.');
    }
    
    if (!confirmed) return;
    
    // Remove from array
    goals.splice(index, 1);
    
    // CRITICAL: Save to localStorage immediately
    localStorage.setItem('destinylens_goals', JSON.stringify(goals));
    console.log('Goal deleted. Saved goals:', goals);
    
    // Re-render
    renderGoals();
    
    // Show success
    if (window.showDLSuccess) {
        window.showDLSuccess('Goal deleted successfully');
    }
}

// REPLACE the saveGoal function:
async function saveGoal() {
    const title = document.getElementById('goalTitle').value.trim();
    const amount = parseFloat(document.getElementById('goalAmount').value) || 0;
    
    if (!title) {
        const msg = 'Please enter a goal title';
        if (window.showDLWarning) window.showDLWarning(msg);
        else alert(msg);
        return;
    }
    if (amount <= 0) {
        const msg = 'Please enter a valid amount';
        if (window.showDLWarning) window.showDLWarning(msg);
        else alert(msg);
        return;
    }
    
    try {
        let imageUrl = tempGoalImage;
        
        // If there's a new image (base64), keep it as base64 for reliability
        // Only upload to storage if it's a new file and we want persistence
        if (tempGoalImage && tempGoalImage.startsWith('data:')) {
            // Store base64 directly in localStorage for reliability
            // (Supabase storage URLs can expire or have CORS issues)
            imageUrl = tempGoalImage;
        }
        
        const goal = {
            icon: selectedIcon,
            title: title,
            amount: amount,
            image: imageUrl || 'dashboard-preview.jpg',
            createdAt: new Date().toISOString()
        };
        
        if (goalEditIndex !== null) {
            // Update existing - preserve createdAt
            goals[goalEditIndex] = { ...goals[goalEditIndex], ...goal };
            console.log('Updated goal at index', goalEditIndex, goals[goalEditIndex]);
        } else if (goals.length < 4) {
            // Add new goal
            goals.push(goal);
            console.log('Added new goal:', goal);
        } else {
            const msg = 'Maximum 4 goals reached';
            if (window.showDLWarning) window.showDLWarning(msg);
            else alert(msg);
            return;
        }
        
        // CRITICAL: Save to localStorage immediately
        localStorage.setItem('destinylens_goals', JSON.stringify(goals));
        console.log('Goals saved to localStorage:', goals);
        
        renderGoals();
        closeModal('goalModal');
        
        // Show success
        const successMsg = goalEditIndex !== null ? 'Goal updated!' : 'Goal added!';
        if (window.showDLSuccess) window.showDLSuccess(successMsg);
        
        // Reset form
        resetGoalForm();
        
    } catch (err) {
        console.error('Error saving goal:', err);
        const msg = 'Error saving goal. Please try again.';
        if (window.showDLError) window.showDLError(msg);
        else alert(msg);
    }
}

// ADD this helper function:

// Load goals - ONLY from localStorage, never overwrite with defaults if exists
const savedGoals = localStorage.getItem('destinylens_goals');
if (savedGoals) {
    try {
        goals = JSON.parse(savedGoals);

        goals = [];

// Only create defaults if NO goals exist at all
if (goals.length === 0 && calc) {
    const map = [
        {k: 'home', i: '🏖️', t: calc.home_description || 'Dream Home'},
        {k: 'vehicle', i: '🚗', t: calc.vehicle_description || 'Dream Vehicle'},
        {k: 'travel', i: '✈️', t: calc.travel_description || 'Travel'},
        {k: 'food', i: '🍽️', t: calc.food_description || 'Food & Dining'}
    ];
    goals = map.map(g => ({
        icon: g.i,
        title: g.t,
        amount: calc[g.k + '_monthly_amount'] || 0,
        image: 'dashboard-preview.jpg',
        createdAt: new Date().toISOString()
    })).filter(g => g.amount > 0).slice(0, 4);
    
    // Save defaults to localStorage
    if (goals.length > 0) {
        localStorage.setItem('destinylens_goals', JSON.stringify(goals));
        console.log('Created and saved default goals:', goals);
    }
}

// REPLACE the renderGoals function:
function renderGoals() {
    const grid = document.getElementById('goalsGrid');
    if (!grid) return;
    
    let html = goals.map((g, i) => {
        // Check if goal has a custom image (not the default)
        const hasCustomImage = g.image && g.image !== 'dashboard-preview.jpg';
        
        // Build card style
        let cardStyle = '';
        if (hasCustomImage) {
            // Use background-image for better control
            cardStyle = `background-image: url('${g.image}'); background-size: cover; background-position: center;`;
        } else {
            // Default gradient background
            cardStyle = `background: linear-gradient(145deg, rgba(169, 76, 240, 0.2) 0%, rgba(246, 194, 107, 0.1) 100%);`;
        }
        
        return `
        <div class="goal-card" style="${cardStyle}" data-index="${i}">
            ${hasCustomImage ? '' : `<div style="position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(145deg, rgba(169, 76, 240, 0.15) 0%, rgba(246, 194, 107, 0.08) 100%);"></div>`}
            <div class="goal-info">
                <div class="goal-emoji">${g.icon}</div>
                <div class="goal-name">${escapeHtml(g.title)}</div>
                <div class="goal-amt">${format$(g.amount)}/mo</div>
            </div>
            <div class="goal-menu-btn" onclick="toggleDropdown(event, ${i})">⋮</div>
            <div class="goal-dropdown" id="dropdown-${i}">
                <div class="goal-dropdown-item" onclick="editGoal(${i})">✏️ Edit Goal</div>
                <div class="goal-dropdown-item delete" onclick="deleteGoal(${i})">🗑️ Delete</div>
            </div>
        </div>
        `;
    }).join('');
    
    // Add the "Add Goal" card if less than 4 goals
    if (goals.length < 4) {
        html += `
        <div class="goal-card add-card" onclick="openAddGoalModal()">
            <div class="add-plus">+</div>
            <div class="add-text">Add Goal</div>
        </div>
        `;
    }
    
    grid.innerHTML = html;
    console.log('Rendered', goals.length, 'goals');
}

// ADD helper for HTML escaping:
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// REPLACE closeModal function:
function closeModal(id) {
    console.log('Closing modal:', id);
    const modal = document.getElementById(id);
    if (modal) {
        modal.classList.remove('active');
    }
    
    // Reset temp state when closing goal modal
    if (id === 'goalModal') {
        resetGoalForm();
    }
    if (id === 'bgModal') {
        tempBgImage = null;
        document.getElementById('bgPreview').style.display = 'none';
        document.getElementById('bgUploadArea').classList.remove('has-image');
        document.getElementById('bgFile').value = '';
    }
}
